name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: bin/brain test
      - name: Validate vault structure
        run: bin/brain validate

  personal-data-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for personal data
        run: |
          if grep -rnIP '(/Users/|/home/[a-z])|xox[bp]-[A-Za-z0-9-]+|ghp_[A-Za-z0-9]+|AKIA[A-Z0-9]{16}|[A-Za-z0-9._%+-]+@(?!(example\.com|example\.org))[A-Za-z0-9.-]+\.[A-Za-z]{2,}' . --exclude-dir=.git --exclude-dir=.github; then
            echo "Personal data pattern matched above — remove it before merging." >&2
            exit 1
          fi
